<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>06-04 Selector Lanjutan</title>
  <style>
    /* Child > langsung anak */
    ul > li { color: blue; font-weight: bold; }
    /* Descendant - semua keturunan */
    div span { color: purple; }
    /* Adjacent + - tepat setelahnya */
    h2 + p { background: yellow; }
    /* General ~ - semua setelahnya */
    h2 ~ p { border-left: 3px solid orange; padding-left: 8px; }
    /* Attribute */
    a[href^="https"] { color: green; }
    input[type="password"] { border: 2px solid red; }
    /* Grouping */
    h1, h2, h3 { font-family: Georgia, serif; }
    /* Universal */
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>Selector Lanjutan</h1>
  <ul><li>Anak langsung - biru</li><ul><li>Cucu - tidak biru</li></ul></ul>
  <div><p><span>Span di dalam div - ungu</span></p></div>
  <h2>Judul H2</h2>
  <p>Paragraf tepat setelah H2 - kuning</p>
  <p>Paragraf setelahnya lagi - ada border orange</p>
  <p><a href="https://google.com">Link https - hijau</a></p>
  <input type="password" placeholder="Password">
</body>
</html>
