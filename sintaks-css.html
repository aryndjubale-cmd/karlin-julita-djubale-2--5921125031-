<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>05-01 Sintaks CSS</title>
  <style>
    /* Sintaks: selector { properti: nilai; properti: nilai; } */
    h1 { color: navy; font-size: 32px; text-align: center; }
    p { color: #333; margin: 10px 0; }
    /* Komentar di CSS pakai /* ... */ */
    .penting { color: red !important; }
  </style>
</head>
<body>
  <h1>Sintaks CSS</h1>
  <p>Selector memilih elemen, deklarasi mengatur tampilannya.</p>
  <p class="penting">Ini pakai !important - menang dari yang lain.</p>
</body>
</html>
