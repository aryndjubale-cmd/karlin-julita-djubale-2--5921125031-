<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>05-03 Font</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; font-size: 16px; }
    .serif { font-family: Georgia, serif; }
    .kecil { font-size: 12px; }
    .besar { font-size: 28px; font-weight: bold; }
    .miring { font-style: italic; }
    .caps { font-variant: small-caps; }
    .tebal { font-weight: 700; }
    .jarak { letter-spacing: 3px; word-spacing: 8px; }
  </style>
</head>
<body>
  <h1>Properti Font</h1>
  <p class="serif">Font Serif - Georgia</p>
  <p class="kecil">Font kecil 12px</p>
  <p class="besar">Font besar 28px tebal</p>
  <p class="miring">Font miring italic</p>
  <p class="caps">Font Small Caps</p>
  <p class="jarak">Jarak Huruf dan Kata</p>
</body>
</html>
